[package]
name = "native-module"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6", "async"] }
napi-derive = "2"
once_cell = "1"
opencv = { version = "0.98.1", default-features = false, features = [
    "imgproc",
    "objdetect",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
